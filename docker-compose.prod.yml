x-backend-env: &backend-env
  env_file: .env.prod
  environment:
    NODE_ENV: production
    PORT: 5000
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    BINANCE_API_KEY: ${BINANCE_API_KEY}
    BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY}
    JWT_SECRET: ${JWT_SECRET}
    TRADING_MODE: ${TRADING_MODE}
    RESET_DB_ON_START: ${RESET_DB_ON_START:-true}
    MAX_TRADERS: ${MAX_TRADERS:-1}
    LEVERAGE: ${LEVERAGE}
    INITIAL_CAPITAL: ${INITIAL_CAPITAL}
    POSITION_SIZE: ${POSITION_SIZE}
    TRADER_BEHAVIOR: ${TRADER_BEHAVIOR:-reversal}
    GRID_LEVELS_PER_SIDE: ${GRID_LEVELS_PER_SIDE:-10}
    GRID_DISTANCE_PERCENT: ${GRID_DISTANCE_PERCENT:-5}
    TRADER_TAKE_PROFIT_PERCENT: ${TRADER_TAKE_PROFIT_PERCENT:-10}
    TRADER_MAX_LIFETIME_HOURS: ${TRADER_MAX_LIFETIME_HOURS:-12}
    CORS_ORIGIN: ${CORS_ORIGIN}
    LOG_LEVEL: warn

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: always
    <<: *backend-env
    volumes:
      - backend_logs:/app/logs
    command: >
      sh -c "
        npx prisma migrate deploy &&
        node dist/server.js
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/system/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      target: production
    restart: always
    <<: *backend-env
    volumes:
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - bot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: always
    depends_on:
      - backend
    networks:
      - bot-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    networks:
      - bot-network

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  nginx_certs:

networks:
  bot-network:
    driver: bridge
