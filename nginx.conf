worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  # Required for WebSocket upgrade
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Use Docker's embedded DNS so upstream names are resolved per-request,
  # not at nginx startup. This prevents "host not found in upstream" crashes
  # when 'bot' or 'web' aren't ready yet.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;

  server {
    listen 80 default_server;
    server_name _;

    # WebSocket gateway
    location /ws {
      set $bot_upstream "bot:4000";
      proxy_pass         http://$bot_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # REST API
    location /api/ {
      set $bot_upstream "bot:4000";
      proxy_pass         http://$bot_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /healthz {
      set $bot_upstream "bot:4000";
      proxy_pass         http://$bot_upstream;
    }

    # Next.js (everything else, including HMR fallback in dev)
    location / {
      set $web_upstream "web:3000";
      proxy_pass         http://$web_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
