services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status() } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          }
        '

  # One-shot reset: wipes the bot DB and flushes Redis EVERY time the stack
  # comes up. The bot service waits for this to finish before starting.
  # If you ever want to preserve data, comment out this block and remove the
  # db-reset entry from the bot's depends_on.
  db-reset:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        set -e
        echo "[db-reset] waiting for replica set..."
        until mongosh --host mongo:27017 --quiet --eval 'rs.status().ok' >/dev/null 2>&1; do
          sleep 1
        done
        echo "[db-reset] dropping mongo db 'bot'..."
        mongosh --host mongo:27017 --quiet --eval 'db.getSiblingDB("bot").dropDatabase()'
        echo "[db-reset] flushing redis..."
        apt-get update -qq && apt-get install -y -qq redis-tools >/dev/null
        redis-cli -h redis FLUSHALL
        echo "[db-reset] done."

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/bot?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 4000
    expose:
      - "4000"

  web:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - bot
    environment:
      NODE_ENV: production
      # Server-side rewrites point at the bot inside the docker network.
      # Browser-side requests still flow through the proxy on /api and /ws.
      BACKEND_URL: http://bot:4000
    expose:
      - "3000"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - bot
      - web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mongo-data:
  redis-data:
